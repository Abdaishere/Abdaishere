<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="ui-monospace, 'Cascadia Mono', 'Courier New', monospace" font-size="16">
  <defs>
    <filter id="ng" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="nscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="760" height="340" rx="12" fill="#050d07"/>
  <rect x="2" y="2" width="756" height="336" rx="11" fill="none" stroke="#00ff41" stroke-opacity="0.18" stroke-width="2"/>

  <g filter="url(#ng)">
    <!-- invader sprite -->
    <g fill="#00ff41">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.4s" repeatCount="indefinite"/>
      <g transform="translate(52,66)">
        <rect x="16" y="0" width="8" height="8"/><rect x="72" y="0" width="8" height="8"/>
        <rect x="24" y="8" width="8" height="8"/><rect x="64" y="8" width="8" height="8"/>
        <rect x="16" y="16" width="64" height="8"/>
        <rect x="8" y="24" width="16" height="8"/><rect x="32" y="24" width="32" height="8"/><rect x="72" y="24" width="16" height="8"/>
        <rect x="0" y="32" width="96" height="8"/>
        <rect x="0" y="40" width="8" height="8"/><rect x="16" y="40" width="64" height="8"/><rect x="88" y="40" width="8" height="8"/>
        <rect x="0" y="48" width="8" height="8"/><rect x="16" y="48" width="8" height="8"/><rect x="72" y="48" width="8" height="8"/><rect x="88" y="48" width="8" height="8"/>
        <rect x="24" y="56" width="8" height="8"/><rect x="64" y="56" width="8" height="8"/>
      </g>
    </g>
    <text x="66" y="160" fill="#ffb000" font-size="15">&lt; hello. &gt;</text>

    <!-- info -->
    <text x="230" y="46" fill="#ffffff" font-weight="bold">abda@dxb</text>
    <text x="230" y="66" fill="#00ff41" opacity="0.6">-----------</text>
    <text x="230" y="88" fill="#00ff41">OS: <tspan fill="#d7ffe0">Human 1.0 (Cairo build, Dubai patch)</tspan></text>
    <text x="230" y="109" fill="#00ff41">Host: <tspan fill="#d7ffe0">Dubai, UAE (UTC+4)</tspan></text>
    <text x="230" y="130" fill="#00ff41">Kernel: <tspan fill="#d7ffe0">CS degree, Cairo University</tspan></text>
    <text x="230" y="151" fill="#00ff41">Uptime: <tspan fill="#d7ffe0">since 2002, zero reboots</tspan></text>
    <text x="230" y="172" fill="#00ff41">CMOS: <tspan fill="#d7ffe0">born 2002, still holding charge</tspan></text>
    <text x="230" y="193" fill="#00ff41">Shell: <tspan fill="#d7ffe0">whichever has vim keybindings</tspan></text>
    <text x="230" y="214" fill="#00ff41">Day process: <tspan fill="#d7ffe0">software engineer</tspan></text>
    <text x="230" y="235" fill="#00ff41">Night process: <tspan fill="#d7ffe0">music producer</tspan></text>
    <text x="230" y="256" fill="#00ff41">Daemons: <tspan fill="#d7ffe0">gym, books, podcasts</tspan></text>
    <text x="230" y="277" fill="#00ff41">WPM: <tspan fill="#ffb000">yes</tspan></text>
    <text x="230" y="298" fill="#00ff41">Packages: <tspan fill="#d7ffe0">rust cpp java kotlin js dart</tspan></text>
    <text x="230" y="319" fill="#00ff41">          <tspan fill="#d7ffe0">python flutter godot docker git</tspan></text>

    <!-- terminal color swatches, neofetch style -->
    <g transform="translate(52,240)">
      <rect x="0" y="0" width="18" height="12" fill="#00ff41"/>
      <rect x="20" y="0" width="18" height="12" fill="#ffb000"/>
      <rect x="40" y="0" width="18" height="12" fill="#ff4136"/>
      <rect x="60" y="0" width="18" height="12" fill="#d7ffe0"/>
      <rect x="0" y="14" width="18" height="12" fill="#00b32e" opacity="0.7"/>
      <rect x="20" y="14" width="18" height="12" fill="#b37c00" opacity="0.7"/>
      <rect x="40" y="14" width="18" height="12" fill="#b32d26" opacity="0.7"/>
      <rect x="60" y="14" width="18" height="12" fill="#8fa898" opacity="0.7"/>
    </g>
  </g>

  <rect width="760" height="340" rx="12" fill="url(#nscan)"/>
</svg>
