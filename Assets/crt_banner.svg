<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" font-family="'Courier New', Courier, monospace">
  <defs>
    <!-- phosphor glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- scanlines -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.28"/>
    </pattern>
    <!-- rolling brightness band -->
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <!-- tube vignette -->
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <!-- typing reveal for the prompt line -->
    <clipPath id="type">
      <rect x="70" y="196" width="0" height="30">
        <animate attributeName="width" begin="1.2s" dur="2.4s" calcMode="discrete"
          values="0;40;80;120;160;200;240;280;320;360;400;440;480;520;560"
          fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- tube -->
  <rect width="960" height="260" rx="16" fill="#020a04"/>
  <rect x="3" y="3" width="954" height="254" rx="14" fill="none" stroke="#00ff41" stroke-opacity="0.12" stroke-width="2"/>

  <!-- screen content, flickers very slightly -->
  <g filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.93;1;1;0.9;1;0.97;1" dur="3.7s" repeatCount="indefinite"/>

    <text x="70" y="106" font-size="64" font-weight="bold" fill="#00ff41" letter-spacing="6">ABDA-OS</text>
    <text x="392" y="106" font-size="22" fill="#00ff41" opacity="0.75">v24.0</text>
    <text x="70" y="146" font-size="19" fill="#00ff41" opacity="0.85">personal mainframe . dubai node . est 2002</text>

    <g clip-path="url(#type)">
      <text x="70" y="218" font-size="21" fill="#00ff41">abda@dxb:~$ ./run fun_projects --all</text>
    </g>
    <!-- block cursor -->
    <rect x="528" y="200" width="13" height="22" fill="#00ff41" opacity="0">
      <animate attributeName="opacity" begin="3.6s" dur="1.06s" values="1;1;0;0" repeatCount="indefinite"/>
    </rect>

    <!-- pixel alien, waves -->
    <g fill="#00ff41" transform="translate(806,64)">
      <animateTransform attributeName="transform" type="translate" values="806,64;806,58;806,64" dur="2.2s" repeatCount="indefinite" additive="replace"/>
      <rect x="24" y="0" width="12" height="12"/><rect x="84" y="0" width="12" height="12"/>
      <rect x="36" y="12" width="12" height="12"/><rect x="72" y="12" width="12" height="12"/>
      <rect x="24" y="24" width="72" height="12"/>
      <rect x="12" y="36" width="24" height="12"/><rect x="48" y="36" width="24" height="12"/><rect x="84" y="36" width="24" height="12"/>
      <rect x="0" y="48" width="120" height="12"/>
      <rect x="0" y="60" width="12" height="12"/><rect x="24" y="60" width="72" height="12"/><rect x="108" y="60" width="12" height="12"/>
      <rect x="0" y="72" width="12" height="12"/><rect x="24" y="72" width="12" height="12"/><rect x="84" y="72" width="12" height="12"/><rect x="108" y="72" width="12" height="12"/>
      <rect x="36" y="84" width="12" height="12"/><rect x="72" y="84" width="12" height="12"/>
    </g>
  </g>

  <!-- rolling band -->
  <rect x="0" y="-70" width="960" height="70" fill="url(#roll)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 400" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- scanlines + vignette on top -->
  <rect width="960" height="260" rx="16" fill="url(#scan)"/>
  <rect width="960" height="260" rx="16" fill="url(#vig)"/>
</svg>
